name: Sync labels

on:
  push:
    branches:
      - main
      - master
    paths:
      - .github/labels.yml

jobs:
  labels:
    permissions: write-all
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v2
      - name: Run Label Sync
        uses: micnncim/action-label-syncer@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
